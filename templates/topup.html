<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking - Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 50px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #333; margin-bottom: 5px; }
        .card-id { color: #666; font-size: 14px; margin-bottom: 20px; }
        .balance-box { background-color: #e9ecef; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .balance { font-size: 32px; font-weight: bold; color: #28a745; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .success { color: green; font-weight: bold; margin-bottom: 15px; }
        .logout { display: inline-block; margin-top: 20px; color: #dc3545; text-decoration: none; font-weight: bold; }
        .logout:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>My Parking Wallet</h2>
    <div class="card-id">Card ID: {{ card_id }}</div>
    
    {% if success %}
        <div class="success">{{ success }}</div>
    {% endif %}

    <div class="balance-box">
        <div>Current Balance</div>
        <div class="balance">RM {{ "%.2f"|format(balance) }}</div>
    </div>

    <form action="/topup" method="POST">
        <label style="text-align: left; display: block;">Top-Up Amount (RM):</label>
        <input type="number" name="amount" min="1" step="0.01" placeholder="Enter amount" required>
        <button type="submit">Top Up Now</button>
    </form>

    <a href="/logout" class="logout">Logout</a>
</div>

</body>
</html>
